<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wedding Invitation ·  &amp; </title>
<meta name="description" content="Together with our families, we joyfully invite you to celebrate our wedding day.">
<meta property="og:title" content="Wedding Invitation ·  & ">
<meta property="og:description" content="Kindly scan to view our love and memories">
<meta property="og:image" content="https://broken-sound-3f36.lmproduction1993.workers.dev/photos/imw1f1wtqnwrg.jpg">
<meta name="theme-color" content="#f6f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23b8955a%27/%3E%3Cpath d=%27M32 47S17 38 17 27a8 8 0 0 1 15-4 8 8 0 0 1 15 4c0 11-15 20-15 20z%27 fill=%27%23fff8e6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{
  --ivory:#f8f4ee; --paper:#fffdf9; --ink:#3a3330; --muted:#8a7f78;
  --gold:#b8955a; --gold2:#e3c98f; --gold-deep:#8c6a33;
  --mauve:#d8c3cc; --mauve-deep:#a9879a; --envelope:#dfe5ea;
  --mm:'Pyidaungsu','Padauk','Noto Sans Myanmar',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --script:'Great Vibes',cursive;
  --hand:'Caveat',cursive;
  --t:var(--mm);
}
html[lang=en]{--t:'Cormorant Garamond',Georgia,serif}
html[lang=zh]{--t:'PingFang SC','Noto Sans CJK SC','Noto Serif CJK SC','Microsoft YaHei',serif}
html[lang=th]{--t:'Noto Sans Thai','Sarabun','Leelawadee UI',sans-serif}
html[lang=shn]{--t:'Noto Sans Myanmar','Padauk','Pyidaungsu',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--t);background:var(--ivory);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
.mm{font-family:var(--t);line-height:2}
img{display:block;max-width:100%}
.gold-text{background:linear-gradient(120deg,var(--gold-deep),var(--gold2) 45%,var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Envelope intro ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#eef1f4,#cfd7de);transition:opacity 1s ease .9s,visibility 0s 1.9s}
#intro.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/4.2;background:var(--envelope);border-radius:6px;box-shadow:0 30px 60px -20px rgba(40,50,70,.45);cursor:pointer;perspective:1200px}
.env::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 40%,rgba(255,255,255,.25));pointer-events:none}
.env .flap{position:absolute;left:0;right:0;top:0;height:46%;background:#e8ecf0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s cubic-bezier(.6,0,.3,1);z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.08))}
#intro.open .flap{transform:rotateX(180deg)}
.env .seal{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;z-index:3;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f3dca6,#b8955a 55%,#7e5c28);box-shadow:0 4px 10px rgba(80,55,20,.4),inset 0 -3px 6px rgba(0,0,0,.25);font-family:var(--script);font-size:30px;color:#fff8e6;text-shadow:0 1px 1px rgba(0,0,0,.3);transition:transform .6s,opacity .6s}
#intro.open .seal{transform:translate(-50%,-50%) scale(.3);opacity:0}
.env .front{position:absolute;inset:auto 0 0 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:13%;z-index:1}
.env .front .w{font-family:var(--script);font-size:44px;line-height:1}
.env .front .i{font-family:var(--serif);letter-spacing:.35em;font-size:12px;color:var(--muted);margin-top:4px}
.env .tassel{position:absolute;right:16%;top:-6px;width:2px;height:70px;background:#fff;z-index:4;box-shadow:0 0 0 1px rgba(0,0,0,.03)}
.env .tassel::after{content:"";position:absolute;left:-7px;top:60px;width:16px;height:52px;background:repeating-linear-gradient(90deg,#fff 0 1px,#eef1f4 1px 2px);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.tap{position:absolute;bottom:-56px;left:0;right:0;text-align:center;font-family:var(--t);font-size:14px;color:#6b7783;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Layout ---------- */
section{padding:72px 22px;max-width:640px;margin:0 auto;text-align:center}
.eyebrow{font-family:var(--serif);letter-spacing:.32em;font-size:12px;text-transform:uppercase;color:var(--gold-deep)}
.h-script{font-family:var(--script);font-size:clamp(40px,11vw,58px);font-weight:400;line-height:1.15;margin:8px 0 10px}
.divider{width:140px;height:18px;margin:14px auto;background:
  linear-gradient(var(--gold),var(--gold)) left 50%/52px 1px no-repeat,
  linear-gradient(var(--gold),var(--gold)) right 50%/52px 1px no-repeat;position:relative}
.divider::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);color:var(--gold);font-size:13px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;max-width:none;padding:0;display:flex;align-items:flex-end;justify-content:center;color:#fff;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.08);animation:kb 18s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,12,.15) 0%,rgba(20,15,12,0) 35%,rgba(20,15,12,.65) 100%)}
.hero .inner{position:relative;z-index:2;padding:0 22px 13svh}
.hero .eyebrow{color:#f5e6c4}
.hero h1{font-family:var(--script);font-weight:400;font-size:clamp(48px,14vw,82px);line-height:1.05;margin:10px 0;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero h1 span{display:block;font-family:var(--serif);font-size:.32em;letter-spacing:.3em;margin:4px 0}
.hero .date{font-family:var(--serif);letter-spacing:.4em;font-size:15px}
.scroll-cue{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;width:22px;height:36px;border:1.5px solid rgba(255,255,255,.7);border-radius:12px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:cue 1.8s infinite}
@keyframes cue{to{transform:translateY(12px);opacity:0}}

/* ---------- Invitation card ---------- */
.card{background:var(--paper);border:1px solid #eadfcd;border-radius:4px;padding:44px 26px;position:relative;box-shadow:0 18px 40px -24px rgba(90,70,40,.35)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold2);pointer-events:none}
.corner{position:absolute;width:54px;height:54px;color:var(--gold)}
.corner.tl{top:4px;left:4px}.corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}.corner.br{bottom:4px;right:4px;transform:scale(-1)}
.monogram{font-family:var(--script);font-size:64px;line-height:1;margin:6px 0}
.monogram i{font-family:var(--serif);font-style:italic;font-size:28px;margin:0 4px;vertical-align:middle}
.invite-mm{font-size:16px;margin:16px 0}
.parents{display:grid;gap:18px;margin:26px 0 8px}
.parents .p{font-family:var(--t);font-size:14px;color:var(--muted);line-height:1.9}
.parents .n{font-family:var(--script);font-size:38px;color:var(--ink);line-height:1.2}
.parents .nm{font-family:var(--t);font-size:15px;color:var(--gold-deep)}
.amp{font-family:var(--script);font-size:34px;color:var(--gold)}

/* ---------- Countdown ---------- */
.countdown[hidden]{display:none}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.countdown div{background:var(--paper);border:1px solid #eadfcd;border-radius:10px;padding:16px 4px}
.countdown b{display:block;font-family:var(--serif);font-size:clamp(26px,8vw,36px);font-weight:600;color:var(--gold-deep)}
.cd-done{margin-top:22px;padding:18px;border:1px solid #eadfcd;border-radius:10px;background:var(--paper);color:var(--gold-deep);font-size:16px}
.countdown small{font-family:var(--t);font-size:12px;color:var(--muted)}

/* ---------- Event details ---------- */
.details{display:grid;gap:14px;margin-top:24px;text-align:left}
.detail{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid #eadfcd;border-left:3px solid var(--gold);border-radius:8px;padding:16px 18px}
.detail svg{flex:none;width:30px;height:30px;color:var(--gold)}
.detail .k{font-family:var(--t);font-size:12px;color:var(--muted)}
.detail .v{font-family:var(--t);font-size:16px;font-weight:600;line-height:1.7}
.detail .e{font-family:var(--serif);font-size:14px;color:var(--muted);font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{font-family:var(--t);font-size:14px;border:1px solid var(--gold);color:var(--gold-deep);background:transparent;padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.25s}
.btn:hover,.btn.solid{background:var(--gold);color:#fff}
.btn.solid:hover{background:var(--gold-deep)}

/* ---------- Our Story album (scrapbook like the video) ---------- */
.story-wrap{background:linear-gradient(180deg,var(--ivory),#efe6ea 18%,#efe6ea 82%,var(--ivory));max-width:none}
.album{position:relative;max-width:430px;margin:26px auto 0}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:6px;box-shadow:0 24px 50px -20px rgba(80,50,70,.45)}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4.6;position:relative;overflow:hidden;
  background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 40%),
   radial-gradient(circle at 90% 90%,rgba(120,80,100,.12),transparent 50%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px),
   var(--mauve)}
.page .count{position:absolute;top:12px;left:14px;font-family:var(--serif);font-size:12px;color:rgba(60,40,50,.6);z-index:5}
.page h3{font-family:var(--script);font-weight:400;font-size:46px;color:#4a3340;line-height:1}
.page .sub{font-family:var(--t);font-size:13px;letter-spacing:.12em;color:#5d4553}
.ph{position:absolute;background:#fff;padding:7px 7px 26px;box-shadow:0 8px 18px rgba(60,30,50,.28)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.tape::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(-4deg);background:rgba(255,248,230,.75);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.torn{position:absolute;filter:drop-shadow(0 8px 12px rgba(60,30,50,.3))}
.torn img{width:100%;height:100%;object-fit:cover;clip-path:polygon(2% 6%,9% 2%,18% 5%,27% 1%,38% 4%,49% 0,60% 4%,71% 1%,82% 5%,92% 2%,99% 7%,97% 18%,100% 30%,97% 42%,99% 55%,96% 68%,99% 80%,97% 93%,90% 99%,78% 96%,66% 100%,54% 96%,42% 99%,30% 96%,18% 100%,7% 96%,1% 90%,3% 77%,0 64%,3% 50%,0 37%,3% 24%,0 14%)}
.film{position:absolute;background:#2b2326;padding:14px 22px;display:grid;gap:10px;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.film::before,.film::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,transparent 0 6px,#efe6ea 6px 12px);opacity:.85}
.film::before{left:6px}.film::after{right:6px}
.film img{width:100%;aspect-ratio:4/3;object-fit:cover}
.arch{position:absolute;overflow:hidden;border-radius:999px 999px 6px 6px;border:6px solid #fff;box-shadow:0 12px 24px rgba(60,30,50,.3)}
.arch img{width:100%;height:100%;object-fit:cover}
.hand{position:absolute;font-family:var(--hand);font-size:20px;color:#4a3340;line-height:1.25}
.doodle{position:absolute;color:#fff;opacity:.9}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);z-index:6}
.nav.prev{left:-12px}.nav.next{right:-12px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:50%;background:#cdbac3;transition:.3s}
.dots i.on{background:var(--mauve-deep);width:20px;border-radius:4px}

/* ---------- Gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:24px}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;cursor:zoom-in;transition:transform .4s,filter .4s}
.gallery img:hover{transform:scale(1.03);filter:brightness(1.05)}
.gallery img:nth-child(6n+1){grid-column:span 2;grid-row:span 2;aspect-ratio:auto;height:100%}
#lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,16,14,.94);display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:84vh;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#lightbox button{position:absolute;background:none;border:none;color:#fff;font-size:34px;cursor:pointer;padding:14px;opacity:.85}
#lightbox .x{top:10px;right:10px}#lightbox .l{left:4px}#lightbox .r{right:4px}
#lightbox .c{position:absolute;bottom:18px;color:#ccc;font-family:var(--serif);font-size:14px}

/* ---------- RSVP ---------- */
form{display:grid;gap:12px;margin-top:22px;text-align:left}
label{font-family:var(--t);font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;font-family:var(--t);font-size:16px;padding:12px 14px;border:1px solid #e2d6c3;border-radius:8px;background:var(--paper);color:var(--ink);margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px;border:1px solid #e2d6c3;border-radius:8px;font-family:var(--t);font-size:14px;cursor:pointer;background:var(--paper)}
.seg input:checked+span{background:var(--gold);color:#fff;border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#3a3330;color:#fff;font-family:var(--t);font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:.35s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Footer / floating ---------- */
footer{padding:60px 22px 110px;text-align:center;background:#efe6ea}
footer .h-script{font-size:46px}
footer .credit{margin-top:18px;font-family:var(--serif);font-size:13px;letter-spacing:.15em;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:18px;z-index:50;display:grid;gap:10px}
.fab button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(184,149,90,.5);background:rgba(255,253,249,.92);backdrop-filter:blur(6px);color:var(--gold-deep);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fab svg{width:20px;height:20px}
#musicBtn.playing svg{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.petal{position:fixed;top:-20px;z-index:40;pointer-events:none;width:12px;height:12px;background:radial-gradient(circle at 30% 30%,#fff,#f3dfe4);border-radius:12px 0 12px 0;opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.2}}

/* ---------- Language switcher ---------- */
html:not([lang=en]) .eyebrow,html:not([lang=en]) .page .sub,html:not([lang=en]) .hero .date{letter-spacing:.04em;text-transform:none}
.eyebrow{font-family:var(--t)}
.langbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.langbar button{font-family:'Noto Sans Myanmar','Padauk','Noto Sans Thai','PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid rgba(184,149,90,.55);background:rgba(255,253,249,.8);color:var(--gold-deep);cursor:pointer;line-height:1.5;transition:.2s}
.langbar button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
#intro .langbar{position:absolute;top:max(22px,env(safe-area-inset-top));left:12px;right:12px}
.langfab{position:fixed;top:12px;right:12px;z-index:60}
.langfab>button{font-family:'Noto Sans Myanmar','Padauk','Noto Sans Thai','PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid rgba(184,149,90,.5);background:rgba(255,253,249,.92);backdrop-filter:blur(6px);color:var(--gold-deep);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);line-height:1.5}
.langfab .langbar{position:absolute;right:0;top:calc(100% + 8px);flex-direction:column;background:rgba(255,253,249,.97);padding:8px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.15);display:none;min-width:120px}
.langfab.open .langbar{display:flex}
body.locked .langfab{display:none}
.hero .loc{font-family:var(--t);font-size:18px;margin-top:6px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}
html[lang=en] .hero .loc,html[lang=en] .parents .nm{display:none}
@media (prefers-reduced-motion:reduce){.petal{display:none}.hero .bg{animation:none}}
</style>
</head>
<body class="locked">

<!-- ========== ENVELOPE INTRO ========== -->
<div id="intro">
  <div class="langbar" data-langbar></div>
  <div class="env" id="envelope" role="button" tabindex="0" aria-label="Open invitation">
    <div class="flap"></div>
    <div class="tassel"></div>
    <div class="seal" id="sealMono">ZS</div>
    <div class="front"><div class="w gold-text">Wedding</div><div class="i">INVITATION</div></div>
    <div class="tap" data-i18n="tapOpen">ဖိတ်စာဖွင့်ရန် နှိပ်ပါ · Tap to open</div>
  </div>
</div>

<script>
/* ===== Envelope opener — standalone, works even if other files fail to load ===== */
(function () {
  var intro = document.getElementById('intro');
  var opened = false;

  function showInviteError(msg) {
    var box = document.getElementById('inviteErr');
    if (!box) {
      box = document.createElement('div');
      box.id = 'inviteErr';
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:#fdecea;color:#8a2c22;border:1px solid #f1b9b2;border-radius:10px;padding:10px 14px;font:14px/1.8 Padauk,"Noto Sans Myanmar",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.15)';
      document.body.appendChild(box);
    }
    box.textContent = msg;
  }

  function openInvite() {
    if (opened) return;
    opened = true;
    intro.classList.add('open');                                   // flap + seal animation
    setTimeout(function () { document.body.classList.remove('locked'); }, 900);   // allow scrolling
    setTimeout(function () { intro.style.display = 'none'; }, 2000);              // remove overlay completely
    try { document.dispatchEvent(new CustomEvent('invite:open')); }               // music + petals (main script)
    catch (e) { var ev = document.createEvent('Event'); ev.initEvent('invite:open', true, true); document.dispatchEvent(ev); }
  }

  window.openInvite = openInvite;
  window.isInviteOpen = function () { return opened; };
  window.showInviteError = showInviteError;

  // one click/tap anywhere on the envelope screen opens it (language buttons excluded)
  intro.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== intro) { if (t.classList && t.classList.contains('langbar')) return; t = t.parentNode; }
    openInvite();
  });
  // keyboard: Enter / Space
  intro.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); openInvite(); }
  });
  // ?open=1 in the link skips the envelope
  if (/[?&]open=1/.test(location.search)) openInvite();

  // if something else breaks later, say so instead of failing silently
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window) return;              // ignore missing images/music
    showInviteError('⚠ Error: ' + (e.message || 'script') + ' — ZIP ကို Extract လုပ်ပြီး folder တစ်ခုလုံးဖြင့် ဖွင့်ပါ');
  });
})();
</script>

<div class="langfab" id="langfab">
  <button id="langToggle" aria-label="Language">🌐 <span id="langCur"></span></button>
  <div class="langbar" data-langbar></div>
</div>

<!-- ========== HERO ========== -->
<section class="hero">
  <div class="bg" id="heroBg"></div>
  <div class="inner">
    <div class="eyebrow" data-i18n="weMarry"></div>
    <h1><span id="hGroom"></span>&amp;<span id="hBride"></span></h1>
    <div class="date" id="hDate"></div>
    <div class="loc" id="hLoc"></div>
  </div>
  <div class="scroll-cue"></div>
</section>

<!-- ========== INVITATION ========== -->
<section>
  <div class="card reveal">
    <svg class="corner tl" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 56V14Q4 4 14 4h42"/><path d="M10 50V18q0-8 8-8h32"/><path d="M14 4c4 6 10 8 16 6M4 14c6 4 8 10 6 16"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg>
    <svg class="corner tr" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 56V14Q4 4 14 4h42"/><path d="M10 50V18q0-8 8-8h32"/><path d="M14 4c4 6 10 8 16 6M4 14c6 4 8 10 6 16"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg>
    <svg class="corner bl" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 56V14Q4 4 14 4h42"/><path d="M10 50V18q0-8 8-8h32"/><path d="M14 4c4 6 10 8 16 6M4 14c6 4 8 10 6 16"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg>
    <svg class="corner br" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 56V14Q4 4 14 4h42"/><path d="M10 50V18q0-8 8-8h32"/><path d="M14 4c4 6 10 8 16 6M4 14c6 4 8 10 6 16"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg>

    <div class="eyebrow">Wedding Invitation</div>
    <div class="monogram gold-text" id="mono">Z<i>&amp;</i>S</div>
    <div class="mm" style="font-size:18px;font-weight:700;color:var(--gold-deep)" data-i18n="cardTitle"></div>
    <div class="divider"></div>
    <p class="mm invite-mm" id="invite"></p>
    <div class="parents">
      <div><div class="p" id="gParents"></div><div class="n" id="gName"></div><div class="nm" id="gNameL"></div></div>
      <div class="amp">&amp;</div>
      <div><div class="p" id="bParents"></div><div class="n" id="bName"></div><div class="nm" id="bNameL"></div></div>
    </div>
  </div>
</section>

<!-- ========== DATE / COUNTDOWN ========== -->
<section style="padding-top:20px">
  <div class="reveal">
    <div class="eyebrow" data-i18n="saveDate"></div>
    <h2 class="h-script gold-text">Counting Down</h2>
    <div class="countdown" id="cd">
      <div><b id="cdD">0</b><small data-i18n="days"></small></div>
      <div><b id="cdH">0</b><small data-i18n="hours"></small></div>
      <div><b id="cdM">0</b><small data-i18n="minutes"></small></div>
      <div><b id="cdS">0</b><small data-i18n="seconds"></small></div>
    </div>
    <p class="mm cd-done" id="cdDone" hidden></p>
  </div>

  <div class="details reveal">
    <div class="detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div><div class="k" data-i18n="date"></div><div class="v" id="dL"></div><div class="e" id="dEN"></div></div>
    </div>
    <div class="detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><div class="k" data-i18n="time"></div><div class="v" id="tL"></div><div class="e" id="tEN"></div></div>
    </div>
    <div class="detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <div><div class="k" data-i18n="venue"></div><div class="v" id="vName"></div><div class="e" id="vAddr"></div></div>
    </div>
  </div>
  <div class="btns reveal">
    <a class="btn solid" id="mapBtn" target="_blank" rel="noopener">📍 <span data-i18n="map"></span></a>
    <button class="btn" id="calBtn">📅 <span data-i18n="calendar"></span></button>
  </div>
</section>

<!-- ========== OUR STORY ALBUM ========== -->
<section class="story-wrap">
  <div class="reveal">
    <div class="eyebrow" data-i18n="storyEyebrow"></div>
    <h2 class="h-script" style="color:#6b4a5c">Our Story</h2>
    <p class="mm" style="font-size:13px;color:var(--muted)" data-i18n="swipe"></p>
  </div>
  <div class="album reveal">
    <div class="pages" id="pages"></div>
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <button class="nav next" id="next" aria-label="Next">›</button>
    <div class="dots" id="dots"></div>
  </div>
</section>

<!-- ========== GALLERY ========== -->
<section>
  <div class="reveal">
    <div class="eyebrow" data-i18n="preWedding"></div>
    <h2 class="h-script gold-text">Sweet Memories</h2>
  </div>
  <div class="gallery reveal" id="gallery"></div>
</section>

<!-- ========== RSVP ========== -->
<section>
  <div class="card reveal" style="padding:40px 22px">
    <div class="eyebrow" data-i18n="rsvp"></div>
    <h2 class="h-script gold-text">Will you join us?</h2>
    <p class="mm" style="font-size:14px;color:var(--muted)" id="rsvpAsk"></p>
    <form id="rsvp">
      <div><label data-i18n="name"></label><input name="name" required data-i18n-ph="namePh"></div>
      <div><label data-i18n="attend"></label>
        <div class="seg">
          <label><input type="radio" name="att" value="yes" checked><span data-i18n="yes"></span></label>
          <label><input type="radio" name="att" value="no"><span data-i18n="no"></span></label>
        </div></div>
      <div><label data-i18n="guests"></label>
        <select name="n" id="guestSel"></select></div>
      <div><label data-i18n="wishes"></label><textarea name="msg" rows="3" data-i18n-ph="wishesPh"></textarea></div>
      <div class="btns" style="margin-top:6px">
        <button class="btn solid" type="submit">✉ <span data-i18n="sms"></span></button>
        <button class="btn" type="button" id="copyRsvp">⧉ <span data-i18n="copy"></span></button>
        <a class="btn" id="callBtn">☎ <span data-i18n="call"></span></a>
      </div>
    </form>
  </div>
</section>

<footer>
  <div class="h-script gold-text">Thank you</div>
  <p class="mm" style="font-size:14px;color:var(--muted)" data-i18n="thanks"></p>
  <p style="font-style:italic;margin-top:12px;color:var(--muted);font-family:var(--serif)" id="quote"></p>
  <div class="monogram gold-text" id="mono2" style="font-size:48px;margin-top:18px">Z<i>&amp;</i>S</div>
  <div class="credit" id="credit"></div>
</footer>

<div class="fab">
  <button id="musicBtn" aria-label="Music" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  <button id="shareBtn" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
</div>

<div id="lightbox"><button class="x" aria-label="Close">×</button><button class="l" aria-label="Previous">‹</button><img alt=""><button class="r" aria-label="Next">›</button><div class="c"></div></div>
<div class="toast" id="toast"></div>
<audio id="bgm" loop preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/helpers.js"></script>
<script>
(function(){
if (!window.WEDDING || !window.I18N || !window.LANGS || !window.pick) {
  // envelope still opens (standalone script above); explain what is missing
  window.showInviteError && window.showInviteError('⚠ js/config.js, js/i18n.js, js/helpers.js ဖိုင်များ မတွေ့ပါ — ZIP ကို Extract (Unzip) လုပ်ပြီး folder တစ်ခုလုံးကို ဖွင့်ပါ / တင်ပါ။');
  return;
}
let W = window.WEDDING; const $ = s => document.querySelector(s);
const set = (sel, txt) => { const el=$(sel); if(el) el.textContent = txt; };
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); };
let d = new Date(W.dateISO);
const PREVIEW = new URLSearchParams(location.search).has('preview');
let lang = detectLang(W.defaultLang), T = I18N[lang];
const P = v => pick(v, lang);

/* ---- Static (language-independent) ---- */
function applyStatic(){
d = new Date(W.dateISO);
const [m1,m2] = W.monogram;
$('#sealMono').textContent = m1 + m2;
['#mono','#mono2'].forEach(s => $(s).innerHTML = `${m1}<i>&amp;</i>${m2}`);
$('#heroBg').style.backgroundImage = `url('${W.cover}')`;
set('#hGroom', pick(W.groom,'en')); set('#hBride', pick(W.bride,'en'));
set('#gName', pick(W.groom,'en')); set('#bName', pick(W.bride,'en'));
set('#dEN', pick(W.date,'en')); set('#tEN', pick(W.time,'en')); set('#vAddr', pick(W.venueAddress,'en'));
$('#mapBtn').href = W.mapUrl; $('#callBtn').href = 'tel:' + W.rsvpPhone;
set('#quote', '“' + W.quote + '”'); set('#credit', W.credit);
}
applyStatic();

/* ---- Language switcher ---- */
document.querySelectorAll('[data-langbar]').forEach(bar => {
  LANGS.forEach(l => { const b = document.createElement('button'); b.type='button'; b.textContent=l.label; b.dataset.l=l.code;
    b.onclick = e => { e.stopPropagation(); setLang(l.code); $('#langfab').classList.remove('open'); }; bar.appendChild(b); });
});
$('#langToggle').onclick = e => { e.stopPropagation(); $('#langfab').classList.toggle('open'); };
document.addEventListener('click', () => $('#langfab').classList.remove('open'));

function setLang(l){
  lang = l; T = I18N[l]; if (!PREVIEW) saveLang(l);
  document.documentElement.lang = l;
  document.querySelectorAll('[data-langbar] button').forEach(b => b.classList.toggle('on', b.dataset.l===l));
  set('#langCur', LANGS.find(x=>x.code===l).label);
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T[el.dataset.i18n] || I18N.en[el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = T[el.dataset.i18nPh]);
  document.title = `${T.cardTitle} · ${pick(W.groom,'en')} & ${pick(W.bride,'en')}`;
  set('#hDate', localDigits([d.getDate(), d.getMonth()+1, d.getFullYear()].map(x=>String(x).padStart(2,'0')).join(' · '), l));
  const same = v => P(v) === pick(v,'en');
  set('#hLoc', same(W.groom) && same(W.bride) ? '' : `${P(W.groom)} & ${P(W.bride)}`);
  set('#invite', P(W.invite));
  set('#gParents', P(W.groomParents)); set('#bParents', P(W.brideParents));
  set('#gNameL', same(W.groom) ? '' : P(W.groom)); set('#bNameL', same(W.bride) ? '' : P(W.bride));
  set('#dL', P(W.date)); set('#tL', P(W.time));
  set('#vName', `${W.venue} · ${P(W.venueAddress)}`);
  set('#rsvpAsk', T.rsvpAsk.replace('{d}', P(W.rsvpDeadline)));
  const gs = $('#guestSel'), cur = gs.value || '2';
  gs.innerHTML = [1,2,3,4,5].map(n => `<option value="${n}">${localDigits(n,l)}</option>`).join(''); gs.value = cur;
  ['#dEN','#tEN','#vAddr'].forEach(s => $(s).style.display = l==='en' ? 'none' : '');
  buildAlbum(); tick();
}

/* ---- Envelope intro ---- */
const audio = $('#bgm'), mBtn = $('#musicBtn');
function onInviteOpen(){
  startPetals();
  if (W.music) { audio.src = W.music; audio.play().then(()=>{ mBtn.hidden=false; mBtn.classList.add('playing'); }).catch(()=>{ mBtn.hidden=false; }); }
}
if (window.isInviteOpen && window.isInviteOpen()) onInviteOpen();
else document.addEventListener('invite:open', onInviteOpen, { once:true });
audio.addEventListener('error', () => { mBtn.hidden = true; });
mBtn.addEventListener('click', () => { if (audio.paused){ audio.play(); mBtn.classList.add('playing'); } else { audio.pause(); mBtn.classList.remove('playing'); } });

/* ---- Countdown ---- */
function tick(){
  let s = Math.max(0, Math.floor((d - Date.now())/1000));
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
  ['#cdD','#cdH','#cdM','#cdS'].forEach((k,i)=> $(k).textContent = localDigits(i? String(v[i]).padStart(2,'0') : v[i], lang));
  const past = isNaN(d) ? false : d <= Date.now();
  $('#cd').hidden = past; $('#cdDone').hidden = !past;
  if (past) $('#cdDone').textContent = T.pastEvent || I18N.en.pastEvent;
}
setInterval(tick, 1000);

/* ---- Add to calendar (.ics) ---- */
$('#calBtn').addEventListener('click', () => {
  const f = x => x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const end = new Date(d.getTime() + (W.durationHours||3)*3600e3);
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LM STUDIO//Wedding//EN','BEGIN:VEVENT',
    'UID:'+Date.now()+'@wedding','DTSTAMP:'+f(new Date()),'DTSTART:'+f(d),'DTEND:'+f(end),
    `SUMMARY:${T.cardTitle} · ${pick(W.groom,'en')} & ${pick(W.bride,'en')}`,`LOCATION:${W.venue}, ${pick(W.venueAddress,'en')}`,
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Wedding','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  a.download = 'wedding.ics'; a.click();
});

/* ---- Our Story album ---- */
const pagesEl = $('#pages'), dotsEl = $('#dots'); let N = W.story.length;
const heart = `<svg width="34" height="30" viewBox="0 0 24 22"><path fill="currentColor" d="M12 21S1 14 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 7-11 14-11 14z"/></svg>`;
const sparkle = `<svg width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg>`;
const img = src => `<img src="${src}" alt="" loading="lazy">`;
const L = {
  torn: (p,sub) => `
    <div style="position:absolute;top:8%;left:6%;right:6%;text-align:center"><h3>${p.title}</h3><div class="sub" style="margin-top:6px">${sub}</div></div>
    <div class="torn" style="left:7%;top:27%;width:86%;height:35%;transform:rotate(-3deg)">${img(p.photos[0])}</div>
    <div class="ph tape" style="left:16%;top:64%;width:68%;height:31%;transform:rotate(2.5deg)">${img(p.photos[1]||p.photos[0])}</div>
    <div class="doodle" style="right:8%;top:22%">${heart}</div>`,
  collage: (p,sub) => `
    <div class="ph tape" style="left:6%;top:9%;width:46%;height:32%;transform:rotate(-5deg)">${img(p.photos[0])}</div>
    <div style="position:absolute;right:6%;top:12%;width:42%;text-align:right"><h3 style="font-size:40px">${p.title}</h3><div class="sub" style="margin-top:6px">${sub}</div></div>
    <div class="ph" style="right:7%;top:40%;width:50%;height:27%;transform:rotate(4deg)">${img(p.photos[1]||p.photos[0])}</div>
    <div class="ph tape" style="left:8%;top:62%;width:48%;height:31%;transform:rotate(-2deg)">${img(p.photos[2]||p.photos[0])}</div>
    <div class="hand" style="left:10%;top:46%;width:38%">every love story is beautiful ♡</div>
    <div class="doodle" style="right:14%;bottom:8%">${sparkle}</div>`,
  film: (p,sub) => `
    <div class="film" style="left:9%;top:6%;width:48%;transform:rotate(-2deg)">${p.photos.slice(0,3).map(img).join('')}</div>
    <div style="position:absolute;right:5%;top:22%;width:36%;text-align:center"><h3 style="font-size:32px">${p.title}</h3><div class="sub" style="margin-top:8px">${sub}</div></div>
    <div class="doodle" style="right:16%;top:54%">${heart}</div>
    <div class="hand" style="right:6%;top:64%;width:36%;text-align:center">two hearts,<br>one journey</div>`,
  quote: (p,sub) => `
    <div style="position:absolute;top:7%;left:0;right:0;text-align:center"><h3>${p.title}</h3><div class="sub" style="margin-top:6px">${sub}</div></div>
    <div class="arch" style="left:18%;top:23%;width:64%;height:54%">${img(p.photos[0])}</div>
    <div class="hand" style="left:8%;right:8%;bottom:6%;text-align:center;font-size:22px">“${W.quote}”</div>
    <div class="doodle" style="left:10%;top:28%">${sparkle}</div>`
};
let cur = 0;
function buildAlbum(){
  const keep = cur; N = W.story.length;
  pagesEl.innerHTML = ''; dotsEl.innerHTML = '';
  W.story.forEach((p,i) => {
    const el = document.createElement('div'); el.className='page';
    el.innerHTML = `<div class="count">${i+1} of ${N}</div>` + (L[p.layout]||L.collage)(p, P(p.sub)||'');
    pagesEl.appendChild(el); dotsEl.appendChild(document.createElement('i'));
  });
  pagesEl.scrollLeft = keep * pagesEl.clientWidth; upd();
}
const go = i => pagesEl.scrollTo({left: Math.max(0,Math.min(N-1,i)) * pagesEl.clientWidth, behavior:'smooth'});
function upd(){ cur = Math.round(pagesEl.scrollLeft / (pagesEl.clientWidth||1)); [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on', i===cur)); }
pagesEl.addEventListener('scroll', () => requestAnimationFrame(upd));
$('#prev').onclick = () => go(cur-1); $('#next').onclick = () => go(cur+1);

/* ---- Gallery + lightbox ---- */
const g = $('#gallery'), lb = $('#lightbox'), lbImg = lb.querySelector('img');
let li = 0;
function buildGallery(){ g.innerHTML='';
W.gallery.forEach((src,i) => { const im = new Image(); im.src=src; im.loading='lazy'; im.alt='Pre-wedding '+(i+1); im.onclick=()=>open(i); g.appendChild(im); }); }
buildGallery();
function open(i){ li=(i+W.gallery.length)%W.gallery.length; lbImg.src=W.gallery[li]; lb.querySelector('.c').textContent=`${li+1} / ${W.gallery.length}`; lb.classList.add('show'); }
lb.querySelector('.x').onclick = () => lb.classList.remove('show');
lb.querySelector('.l').onclick = e => { e.stopPropagation(); open(li-1); };
lb.querySelector('.r').onclick = e => { e.stopPropagation(); open(li+1); };
lb.addEventListener('click', e => { if(e.target===lb) lb.classList.remove('show'); });
let sx=0; lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) open(li+(dx<0?1:-1)); });
document.addEventListener('keydown', e => { if(!lb.classList.contains('show')) return; if(e.key==='Escape') lb.classList.remove('show'); if(e.key==='ArrowLeft') open(li-1); if(e.key==='ArrowRight') open(li+1); });

/* ---- RSVP ---- */
const form = $('#rsvp');
const msg = () => { const f = new FormData(form);
  return `[${T.msgHead}]\n${T.name}: ${f.get('name')||T.none}\n${f.get('att')==='yes'?T.yesMsg:T.noMsg}\n${T.guests}: ${localDigits(f.get('n'),lang)}\n${T.wishes}: ${f.get('msg')||T.none}`; };
form.addEventListener('submit', e => { e.preventDefault();
  const sep = /iPhone|iPad|Mac/.test(navigator.userAgent) ? '&' : '?';
  location.href = `sms:${W.rsvpPhone}${sep}body=${encodeURIComponent(msg())}`; });
$('#copyRsvp').onclick = () => { if(!form.reportValidity()) return;
  navigator.clipboard.writeText(msg()).then(()=>toast(T.copied)).catch(()=>toast(T.copyFail)); };

/* ---- Share (keeps current language in link) ---- */
$('#shareBtn').onclick = async () => {
  const u = new URL(location.href); u.searchParams.set('lang', lang);
  const data = { title: document.title, text: T.cardTitle, url: u.toString() };
  if (navigator.share) { try { await navigator.share(data); } catch(e){} }
  else { navigator.clipboard.writeText(data.url).then(()=>toast(T.linkCopied)); }
};

/* ---- Reveal on scroll ---- */
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.15});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

/* ---- Falling petals ---- */
function startPetals(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let n = 0;
  const t = setInterval(() => {
    const p = document.createElement('div'); p.className='petal';
    p.style.left = Math.random()*100+'vw';
    p.style.setProperty('--dx', (Math.random()*120-60)+'px');
    p.style.animationDuration = (6+Math.random()*5)+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(), 12000);
    if (++n > 40) clearInterval(t);
  }, 450);
}

setLang(lang);

/* ---- Live preview from admin.html ---- */
if (PREVIEW) {
  $('#intro').classList.add('open'); document.body.classList.remove('locked');
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  window.addEventListener('message', e => {
    const m = e.data; if (!m || m.type !== 'wedding-preview') return;
    W = m.config; if (m.i18n) Object.keys(m.i18n).forEach(k => I18N[k] = m.i18n[k]);
    applyStatic(); buildGallery(); setLang(m.lang || lang);
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  });
  parent.postMessage({ type: 'wedding-ready' }, '*');
}
})();
</script>
</body>
</html>
